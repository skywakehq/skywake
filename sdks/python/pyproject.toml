[project]
name = "skywake"
version = "0.2.0"
description = "Skywake for Python: an open-source search index with vector, full-text and hybrid search, on your own S3 bucket."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = [
  "search", "search-index", "s3", "object-storage", "vector-search", "full-text-search", "hybrid-search", "bm25", "rag",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://skywake.dev"
Documentation = "https://skywake.dev/docs"
Repository = "https://github.com/skywakehq/skywake"
Issues = "https://github.com/skywakehq/skywake/issues"

[project.scripts]
skywake = "skywake._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
