# Weekly updates, grouped so each ecosystem is one pull request a week.
# Security updates still come at once.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /sdks/python
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories: [/apps/api, /apps/console, /docker/dev]
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directories: [/docker, /docker/dev]
    schedule: { interval: weekly }
