name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit, with the version beside it. Dependabot keeps both current.
jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Every benchmark type-checks and passes clippy. Running them, quick or full, is in benchmarks.yml.
  benchmarks:
    name: Benchmarks (check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --benches --features skywake-index/bench -- -D warnings

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # This job has no pnpm, so no pnpm cache.
          package-manager-cache: false
      - run: scripts/format.sh --check

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # The API, the SDKs and the end-to-end suites, against the same Postgres and
  # S3 (RustFS) that local development uses.
  end-to-end:
    name: API, SDKs and end-to-end
    runs-on: ubuntu-24.04
    env:
      SKYWAKE_API_DATABASE: postgres://skywake:skywake-dev@localhost:5433/skywake_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.mod
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
      - name: Start Postgres and S3
        run: |
          docker compose -f docker/dev/compose.yaml up -d
          until docker compose -f docker/dev/compose.yaml exec -T postgres pg_isready -U skywake; do sleep 1; done
          until curl -s -o /dev/null http://localhost:9100; do sleep 1; done
          docker compose -f docker/dev/compose.yaml exec -T postgres \
            psql -U skywake -c 'CREATE DATABASE skywake_test'
      - run: pnpm install --frozen-lockfile
      # Runs every package's tests: the engine, the API (with the database
      # above; a skipped test fails in CI), the TypeScript SDK and the npm
      # wrapper of the CLI.
      - run: pnpm test
      - name: Scenario list, every SDK
        run: scripts/scenarios.sh
      - name: Python SDK
        run: uv run --isolated --with pytest --with-editable ./sdks/python pytest -q sdks/python/tests
      - name: Go SDK
        working-directory: sdks/go
        run: go vet ./... && go test ./...
      - name: Java SDK
        working-directory: sdks/java
        run: mvn -q test
      - name: C# SDK
        working-directory: sdks/csharp
        run: dotnet test --nologo
      - name: Ruby SDK
        working-directory: sdks/ruby
        run: ruby -Ilib -Itest -e 'Dir["test/*_test.rb"].each { |f| require File.expand_path(f) }'
      - name: Start the API on S3
        env:
          SKYWAKE_STORE: s3://skywake/ci
          AWS_ENDPOINT: http://localhost:9100
          AWS_ALLOW_HTTP: "true"
          AWS_ACCESS_KEY_ID: skywake
          AWS_SECRET_ACCESS_KEY: skywake-dev
          AWS_REGION: us-east-1
          SKYWAKE_API_ADMIN_TOKEN: ci-admin-token-0123456789
          SKYWAKE_API_LISTEN: 127.0.0.1:8080
          SKYWAKE_API_RATE_LIMIT: "0"
          # RustFS answers STS, so the credentials route is tested too.
          SKYWAKE_API_STS_ENDPOINT: http://localhost:9100
        run: |
          node apps/api/src/main.ts > api.log 2>&1 &
          until curl -sf http://localhost:8080/ready; do sleep 1; done
      - name: Conformance suite
        env:
          SKYWAKE_API: http://localhost:8080/v1
          SKYWAKE_ADMIN: ci-admin-token-0123456789
        run: pnpm --filter @skywake/conformance e2e
      - name: API log
        if: always()
        run: cat api.log || true

  # The one-click installs: the chart, Compose, Terraform and CloudFormation.
  deploy:
    name: Deploy files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The chart's roles.sh is the same as Compose's
        run: cmp docker/postgres/roles.sh deploy/helm/skywake/files/roles.sh
      - name: Helm
        run: |
          helm lint deploy/helm/skywake
          helm lint deploy/helm/skywake --set bootstrap.enabled=true --set docs.enabled=true --set ingress.enabled=true
      - name: Compose
        working-directory: deploy/compose
        run: |
          sed -E 's/^([A-Z_]+(PASSWORD|TOKEN|SECRET|KEY_ID|ACCESS_KEY))=$/\1=x/' .env.example > .env
          docker compose config --quiet
          COMPOSE_PROFILES='' docker compose config --quiet
      - name: Terraform
        run: |
          for dir in deploy/terraform/aws deploy/terraform/aws/examples/eks; do
            docker run --rm -v "$PWD:/w" -w "/w/$dir" hashicorp/terraform:1.13 fmt -check
            docker run --rm -v "$PWD:/w" -w "/w/$dir" --entrypoint sh hashicorp/terraform:1.13 \
              -c 'terraform init -backend=false -input=false > /dev/null && terraform validate'
          done
      - name: CloudFormation
        run: pipx run cfn-lint==1.60.0 deploy/cloudformation/skywake-starter.yaml

  supply-chain:
    name: Dependencies (cargo deny, cargo audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - run: cargo audit
