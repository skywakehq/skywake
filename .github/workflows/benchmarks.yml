name: Benchmarks

# Heavy and cloud runs, started by hand. Every result is uploaded as an artifact; compare two with
# scripts/compare-benchmarks.sh. The pull-request job in ci.yml only compiles and runs the quick ones.
on:
  workflow_dispatch:
    inputs:
      group:
        description: What to run
        type: choice
        options: [micro, index, filesystem, pinning, aws]
        default: micro
      dataset:
        description: "index: a set from benchmarks/datasets/fetch.py list"
        default: sift-1m
      aws:
        description: "aws: plan, up, status, fetch or down"
        default: plan

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  run:
    name: ${{ inputs.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 libfuse3-dev pkg-config
          sudo modprobe fuse || true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.group == 'pinning'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.group == 'pinning'
        with:
          node-version: 22
          cache: pnpm
      - if: inputs.group == 'micro'
        run: scripts/bench.sh micro
      - if: inputs.group == 'index'
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          uv run --script benchmarks/datasets/fetch.py get "$DATASET"
          scripts/bench.sh index "benchmarks/datasets/data/$DATASET" --store slow
      - if: inputs.group == 'filesystem'
        run: scripts/bench.sh filesystem --allow-dirty --client "github ubuntu-24.04 runner"
      - if: inputs.group == 'pinning'
        run: |
          pnpm install --frozen-lockfile --filter @skywake/api... --filter @skywake/engine
          scripts/bench.sh pinning
      - if: inputs.group == 'aws'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BENCH_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BENCH_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.BENCH_AWS_REGION || 'us-west-2' }}
          ACTION: ${{ inputs.aws }}
        run: scripts/bench.sh cloud aws "$ACTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmarks-${{ inputs.group }}-${{ github.run_id }}
          path: benchmarks/results/
          if-no-files-found: ignore
