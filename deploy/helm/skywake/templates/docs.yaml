{{- if .Values.docs.enabled }}
{{- $select := include "skywake.select" (dict "root" . "component" "docs") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-docs
  labels: {{- include "skywake.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.docs.replicas }}
  selector:
    matchLabels: {{- $select | nindent 6 }}
  template:
    metadata:
      labels: {{- $select | nindent 8 }}
    spec:
      containers:
        - name: docs
          image: {{ include "skywake.image" (dict "root" . "component" "docs") }}
          ports:
            - { name: http, containerPort: 3200 }
          readinessProbe:
            httpGet: { path: {{ .Values.docs.basePath | default "/" }}, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.docs.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-docs
  labels: {{- include "skywake.labels" . | nindent 4 }}
spec:
  selector: {{- $select | nindent 4 }}
  ports:
    - { name: http, port: 3200, targetPort: http }
{{- end }}
