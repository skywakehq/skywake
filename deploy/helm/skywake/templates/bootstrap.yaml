{{- if .Values.bootstrap.enabled }}
{{- $secret := .Values.bootstrap.secret }}
# Makes the database roles before the API starts. It runs before every
# install and upgrade, and is safe to run again.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels: {{- include "skywake.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  roles.sh: {{ .Files.Get "files/roles.sh" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels: {{- include "skywake.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: roles
          image: {{ .Values.bootstrap.image }}
          command: [sh, /bootstrap/roles.sh]
          env:
            - { name: PGHOST, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: host } } }
            - { name: PGPORT, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: port } } }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: user } } }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } } }
            - { name: POSTGRES_DB, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: database } } }
            - { name: API_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: api-password } } }
            - { name: CONSOLE_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: console-password } } }
            - { name: ZERO_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $secret }}, key: zero-password } } }
            - { name: PGSSLMODE, value: prefer }
          volumeMounts:
            - { name: script, mountPath: /bootstrap }
      volumes:
        - name: script
          configMap: { name: {{ .Release.Name }}-bootstrap }
{{- end }}
